<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Assets — Theme Gallery</title>
<link rel="stylesheet" href="nord/theme.css">
<link rel="stylesheet" href="dracula/theme.css">
<link rel="stylesheet" href="ember/theme.css">
<link rel="stylesheet" href="forest/theme.css">
<link rel="stylesheet" href="ocean/theme.css">
<link rel="stylesheet" href="mono/theme.css">
<link rel="stylesheet" href="cyberpunk/theme.css">
<link rel="stylesheet" href="coffee/theme.css">
<link rel="stylesheet" href="high-contrast/theme.css">
<link rel="stylesheet" href="terminal/theme.css">
<link rel="stylesheet" href="rose/theme.css">
<link rel="stylesheet" href="dusk/theme.css">
<link rel="stylesheet" href="sakura/theme.css">
<link rel="stylesheet" href="desert/theme.css">
<link rel="stylesheet" href="aurora/theme.css">
<link rel="stylesheet" href="matcha/theme.css">
<link rel="stylesheet" href="slate/theme.css">
<style>
  /* ---- gallery chrome (neutral, independent of the six themes) ---- */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #e8e8ea;
    transition: background 0.25s;
  }
  html.dark body { background: #17171a; }
  html.dark .bar { background: #101013; border-color: #26262b; color: #ececf0; }
  html.dark .bar .sub { color: #9a9aa4; }
  html.dark .mode-btn { background: #202024; border-color: #33333a; color: #d6d6dc; }
  html.dark .mode-btn.on { background: #43434c; border-color: #55555f; color: #ffffff; }

  .bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 28px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #d8d8dd;
  }
  .bar h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .bar .sub { font-size: 13px; color: #6d6d78; }

  .modes { margin-left: auto; display: flex; gap: 6px; }
  .mode-btn {
    padding: 6px 14px; font-size: 13px; font-weight: 500;
    border: 1px solid #cfcfd6; border-radius: 999px;
    background: #fff; color: #44444c; cursor: pointer;
  }
  .mode-btn:hover { border-color: #9d9da8; }
  .mode-btn.on { background: #3a3a44; border-color: #3a3a44; color: #fff; }

  .grid {
    max-width: 1500px; margin: 0 auto;
    padding: 32px 28px 64px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr));
    gap: 24px;
  }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; padding: 20px 14px 48px; } }

  /* ---- themed sections: everything below uses theme variables ---- */
  .theme {
    --pad: 22px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: var(--pad);
    display: flex; flex-direction: column; gap: 16px;
    font-family: var(--font-body);
  }
  .theme header h2 {
    font-family: var(--font-display);
    font-size: var(--text-2xl); line-height: var(--text-2xl--line-height);
    font-weight: 700; letter-spacing: -0.01em;
  }
  .theme header p { font-size: var(--text-sm); color: var(--text-muted); margin-top: 3px; }

  .swatches { display: flex; gap: 7px; }
  .swatches span {
    width: 26px; height: 26px; border-radius: var(--radius-full);
    border: 1px solid var(--border); cursor: default;
  }

  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .b {
    font-family: inherit; font-size: var(--text-sm); font-weight: 600;
    padding: 8px 15px; border-radius: var(--radius-md);
    border: 1px solid transparent; cursor: pointer;
    transition: transform 0.06s ease, filter 0.12s ease;
  }
  .b:active { transform: translateY(1px); }
  .b.primary   { background: var(--primary); color: var(--bg); }
  .b.secondary { background: var(--secondary); color: var(--bg); }
  .b.accent    { background: var(--accent); color: var(--bg); }
  .b.primary:hover   { background: var(--primary-hover); }
  .b.secondary:hover { background: var(--secondary-hover); }
  .b.accent:hover    { background: var(--accent-hover); }
  .b.ghost { background: transparent; border-color: var(--border); color: var(--text); }
  .b.ghost:hover { background: var(--surface); }

  .chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip {
    font-size: var(--text-xs); font-weight: 600;
    padding: 4px 10px; border-radius: var(--radius-full);
  }
  .chip.success { background: var(--success-subtle); color: var(--success); }
  .chip.warning { background: var(--warning-subtle); color: var(--warning); }
  .chip.error   { background: var(--error-subtle);   color: var(--error); }
  .chip.info    { background: var(--info-subtle);    color: var(--info); }

  .field label {
    display: block; font-size: var(--text-xs); font-weight: 600;
    color: var(--text-muted); margin-bottom: 5px; letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .field input {
    width: 100%; font-family: inherit; font-size: var(--text-sm);
    padding: 9px 12px; color: var(--text);
    background: var(--surface-raised);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    outline: none;
  }
  .field input::placeholder { color: var(--text-muted); opacity: 0.75; }
  .field input:focus { box-shadow: 0 0 0 3px var(--ring); border-color: var(--ring); }

  .card {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    padding: 18px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .card h3 { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; }
  .card p  { font-size: var(--text-sm); color: var(--text-muted); line-height: 1.55; }
  .card a  {
    font-size: var(--text-sm); font-weight: 600; text-decoration: none;
    color: var(--primary); align-self: flex-start;
  }
  .card a:hover { color: var(--primary-hover); text-decoration: underline; }

  .type { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .type .big {
    font-family: var(--font-display);
    font-size: var(--text-4xl); font-weight: 700; letter-spacing: -0.02em;
  }
  .type code {
    font-family: var(--font-mono); font-size: var(--text-xs);
    background: var(--surface); border: 1px solid var(--border);
    padding: 2px 7px; border-radius: var(--radius-sm); color: var(--text-muted);
  }
</style>
</head>
<body>

<header class="bar">
  <h1>Theme Gallery</h1>
  <span class="sub">design-assets / themes — 12 pre-built UI themes, light + dark</span>
  <div class="modes" role="group" aria-label="Color mode">
    <button class="mode-btn" data-set="auto">Auto</button>
    <button class="mode-btn" data-set="light">Light</button>
    <button class="mode-btn" data-set="dark">Dark</button>
  </div>
</header>

<main class="grid" id="grid"></main>

<script>
  const THEMES = [
    { id: "nord",    name: "Nord",    desc: "Cool arctic blues and grays. Calm, professional, low-friction.",
      swatch: ["#2e3440", "#516f93", "#596f86", "#88c0d0", "#eceff4"] },
    { id: "dracula", name: "Dracula", desc: "The iconic dark palette — purple, pink and neon pastels.",
      swatch: ["#282a36", "#bd93f9", "#ff79c6", "#8be9fd", "#50fa7b"] },
    { id: "ember",   name: "Ember",   desc: "Warm terracotta, amber and dusty rose. Cozy and inviting.",
      swatch: ["#201a17", "#b15837", "#986724", "#b15462", "#faf6f1"] },
    { id: "forest",  name: "Forest",  desc: "Deep pine greens, sage and earthy ochre. Grounded, organic.",
      swatch: ["#131a14", "#35753f", "#607855", "#8f6b28", "#f4f7f1"] },
    { id: "ocean",   name: "Ocean",   desc: "Airy teals, cyans and deep-sea blues. Fresh and modern.",
      swatch: ["#0b1d26", "#0e7490", "#2563a8", "#077d93", "#f2f9fb"] },
    { id: "mono",    name: "Mono",    desc: "Pure grayscale, sharp corners, monospace display type.",
      swatch: ["#0a0a0a", "#111111", "#454545", "#8f8f8f", "#fafafa"] },
    { id: "cyberpunk", name: "Cyberpunk", desc: "Dark-only blueprint/terminal look — abyss blacks, neon-blue glow, icy-blue accents.",
      swatch: ["#050b14", "#0088ff", "#a8c8ff", "#d5e0ff", "#8ba0b8"] },
    { id: "coffee", name: "Coffee", desc: "Warm café neutrals — cream, caramel and espresso brown. Cozy, grounded.",
      swatch: ["#1a1410", "#8b5e34", "#926a2f", "#95674f", "#faf6f0"] },
    { id: "high-contrast", name: "High-Contrast", desc: "Accessibility-first, WCAG AAA color pairs, pure black/white bases, bold hues.",
      swatch: ["#ffffff", "#0033cc", "#660099", "#b30000", "#000000"] },
    { id: "terminal", name: "Terminal", desc: "Dark-only retro CRT — phosphor-green on black with amber accents.",
      swatch: ["#050805", "#00ff41", "#ffb000", "#7dffce", "#4a9e5c"] },
    { id: "rose", name: "Rose", desc: "Soft rose, lavender and peach pastels. Gentle, friendly and warm.",
      swatch: ["#241a20", "#b15274", "#836699", "#9d6354", "#fdf5f7"] },
    { id: "dusk", name: "Dusk", desc: "Twilight indigo and soft lavender with an amber horizon glow. Calm, dreamy.",
      swatch: ["#14121f", "#5d55b8", "#9a90e8", "#e8a869", "#f7f6fb"] },
    { id: "sakura", name: "Sakura", desc: "Cherry-blossom pinks, plum and peach. Soft, romantic and fresh - spring at first bloom.",
      swatch: ["#241a1f", "#b75077", "#8865a0", "#9e654d", "#fff7f9"] },
    { id: "desert", name: "Desert", desc: "Sun-baked sand, terracotta and ochre. Warm, open and earthy - a canyon at noon.",
      swatch: ["#211a12", "#a85b37", "#8a6b26", "#89694f", "#faf3e7"] },
    { id: "aurora", name: "Aurora", desc: "Polar night teal and violet with ice-blue shimmer. Electric, crisp and luminous.",
      swatch: ["#0d1b1e", "#1c806e", "#7a5fb8", "#34799c", "#f2faf6"] },
    { id: "matcha", name: "Matcha", desc: "Whisked green tea, rice-gold and red bean. Calm, natural and balanced.",
      swatch: ["#1b2118", "#537d36", "#83712f", "#a75e52", "#f6f9f0"] },
    { id: "slate", name: "Slate", desc: "Cool slate blues and grays with a copper spark. Quiet, precise and modern.",
      swatch: ["#16191d", "#4a6b8a", "#5f6b7a", "#94665b", "#f5f7f9"] },
  ];

  document.getElementById("grid").innerHTML = THEMES.map(t => `
    <section class="theme" data-theme="${t.id}">
      <header>
        <h2>${t.name}</h2>
        <p>${t.desc}</p>
      </header>
      <div class="swatches">${t.swatch.map(c => `<span style="background:${c}" title="${c}"></span>`).join("")}</div>
      <div class="btns">
        <button class="b primary">Primary</button>
        <button class="b secondary">Secondary</button>
        <button class="b accent">Accent</button>
        <button class="b ghost">Ghost</button>
      </div>
      <div class="chips">
        <span class="chip success">Success</span>
        <span class="chip warning">Warning</span>
        <span class="chip error">Error</span>
        <span class="chip info">Info</span>
      </div>
      <div class="field">
        <label>Email address</label>
        <input type="text" placeholder="you@example.com">
      </div>
      <div class="card">
        <h3>Card title</h3>
        <p>Supporting copy that sits below the title, showing body text color, muted tone and line height in this theme.</p>
        <a href="#" onclick="return false">Learn more &rarr;</a>
      </div>
      <div class="type">
        <span class="big">Ag</span>
        <code>font-display</code>
        <code>radius-${t.id}</code>
      </div>
    </section>
  `).join("");

  // ---- mode switching ----
  // auto : sections follow the OS preference (no data-mode attribute)
  // light/dark : forced by setting data-mode on every themed section,
  //              plus html.dark so the neutral gallery chrome follows along.
  const root = document.documentElement;
  const btns = [...document.querySelectorAll(".mode-btn")];
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  let current = "auto";

  function apply(mode) {
    current = mode;
    document.querySelectorAll(".theme").forEach(el => {
      if (mode === "auto") el.removeAttribute("data-mode");
      else el.dataset.mode = mode;
    });
    root.classList.toggle("dark", mode === "dark" || (mode === "auto" && mq.matches));
    btns.forEach(b => b.classList.toggle("on", b.dataset.set === mode));
    localStorage.setItem("da-theme-mode", mode);
  }

  btns.forEach(b => b.addEventListener("click", () => apply(b.dataset.set)));
  mq.addEventListener("change", () => { if (current === "auto") apply("auto"); });

  const saved = localStorage.getItem("da-theme-mode");
  apply(saved === "light" || saved === "dark" ? saved : "auto");
</script>

</body>
</html>
