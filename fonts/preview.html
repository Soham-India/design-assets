<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #71717a;
    --line: #e4e4e7; --card: #fafafa;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --fg: #f4f4f5; --muted: #9d9da8; --line: #2c2c30; --card: #1b1b1e; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 40px clamp(16px, 5vw, 64px); line-height: 1.5;
  }
  header, .group, .family { max-width: 880px; margin-left: auto; margin-right: auto; }
  header { margin-bottom: 40px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin-bottom: 6px; }
  header p { color: var(--muted); font-size: 14px; }
  .group {
    font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); margin: 44px auto 14px;
  }
  .family {
    margin-bottom: 20px; padding: 26px 28px 20px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--card);
  }
  .meta { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .name { font-size: 20px; font-weight: 650; }
  .badge {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px;
  }
  .designer { font-size: 13px; color: var(--muted); margin-left: auto; }
  .sample { display: flex; align-items: baseline; gap: 14px; padding: 6px 0; }
  .wt {
    font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted);
    width: 84px; flex-shrink: 0; text-align: right;
  }
  .sample span:last-child { font-size: 24px; }
  .sample.mono span:last-child { font-size: 21px; }
  .glyphs {
    margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line);
    font-size: 15px; color: var(--muted); word-break: break-all;
  }
</style>

for (const g of GROUPS) {

  for (const f of g.families) {

    sec.className = "family";

      const w = parseInt(wt);
